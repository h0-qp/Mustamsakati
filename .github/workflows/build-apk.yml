name: Build Mustamsakati APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flet
        run: pip install flet==0.28.3

      - name: Generate app icon
        run: |
          pip install pillow
          python make_icon.py

      - name: Build APK
        run: flet build apk --project Mustamsakati --product Mustamsakati

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mustamsakati-APK
          path: build/apk/**/*.apk
          if-no-files-found: error
          
